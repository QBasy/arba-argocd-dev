# Портал документации (arba/docs) в окружении dev.
# Строки с маркером "bot:" обновляет CI сервиса (scripts/bump.sh), остальное правят люди.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-arba-docs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  source:
    repoURL: http://gitlab.arba.kz/arba/docs.git
    targetRevision: afdaed5636be9e106ec7a79a75b5e3c143f35578 # bot:revision
    path: .helm
    helm:
      releaseName: arba-docs
      valuesObject:
        global:
          env: dev
          tier: platform
        image:
          repository: registry.arba.kz/arba/docs
          tag: "v0.1.0" # bot:tag
          digest: "sha256:57e77797930d553cf0e02aba3bd9028fdf683d83aadb3af875fbcc72c890b053" # bot:digest
        ingress:
          enabled: true
          host: docs.dev.arba.kz
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

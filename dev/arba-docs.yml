# Портал документации (arba/docs) в окружении dev.
# Строки с маркером "bot:" обновляет CI сервиса (scripts/bump.sh), остальное правят люди.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-arba-docs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  source:
    repoURL: http://gitlab.arba.kz/arba/docs.git
    targetRevision: f7e7831de9cfc9d791934bdcb9a00074181c829d # bot:revision
    path: .helm
    helm:
      releaseName: arba-docs
      valuesObject:
        global:
          env: dev
          tier: platform
        image:
          repository: registry.arba.kz/arba/docs
          tag: "v0.0.4" # bot:tag
          digest: "sha256:cf8bd2a471912c18ec67b9f1d0ab36afce97370306fc8589a718d8a8f000a0d1" # bot:digest
        ingress:
          enabled: true
          host: docs.dev.arba.kz
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

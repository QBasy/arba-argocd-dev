# Application сервиса scoring в dev. Создан автоматически (scripts/new-service.sh); строки с "bot:" обновляет CI.
# Настройки сервиса под окружение dev лежат В РЕПОЗИТОРИИ СЕРВИСА: .helm/values-dev.yaml (необязательный файл).
# Общие значения окружения (NATS, JWT, ...): values/dev-common.yaml в этом репозитории.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-scoring
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "5" }
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  sources:
    - repoURL: http://gitlab.arba.kz/arba/engines/scoring.git
      targetRevision: 448d1cfa990e8902f960a087264e4c7219794079 # bot:revision
      path: .helm
      helm:
        releaseName: scoring
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/values/dev-common.yaml
          - values-dev.yaml
        valuesObject:
          global:
            env: dev
            tier: engine
          image:
            repository: registry.arba.kz/arba/engines/scoring
            tag: "v0.3.1" # bot:tag
            digest: "sha256:29dc97481c4228764fa96bed41940fafebc62457901ba37801020509663c5819" # bot:digest
          replicaCount: 1
          worker:
            enabled: false
          migrate:
            enabled: true                       # PreSync Job: cmd/migrate up
          # переменные приложения читаются с префиксом ORIGINATION_ (kit/conf): ORIGINATION_<СЕКЦИЯ>_<ПОЛЕ>
          env:
            SCORING_LOG_LEVEL: debug
            SCORING_NATS_URL: nats://nats.broker.svc.cluster.local:4222
            # JWT: провайдера (identity) в кластере пока нет, значения-заглушки
            SCORING_JWT_JWKS_URL: http://identity.dev.svc.cluster.local/.well-known/jwks.json
            SCORING_JWT_ISSUER: http://identity.dev.arba.kz
            SCORING_JWT_AUDIENCE: arba
          secretEnv:
            - { name: SCORING_DATABASE_DSN, secret: scoring-db, key: dsn }
    - repoURL: http://gitlab.arba.kz/argocd/argocd-dev.git
      targetRevision: main
      ref: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

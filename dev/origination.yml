# Движок origination (arba/engines/origination) в окружении dev.
# Строки с маркером "bot:" обновляет CI сервиса (scripts/bump.sh), остальное правят люди.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-origination
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "5" }   # после Vault, БД и брокера
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  source:
    repoURL: http://gitlab.arba.kz/arba/engines/origination.git
    targetRevision: e3053fded1ffb7b095e71af9c86908fd50df6d2c # bot:revision
    path: .helm
    helm:
      releaseName: origination
      valuesObject:
        global:
          env: dev
          tier: engine
        image:
          repository: registry.arba.kz/arba/engines/origination
          tag: "v0.2.5" # bot:tag
          digest: "sha256:9b0c0e00bd3faae0ee74602a4b2b07384da65ad3c99b078ec462eac02307d44e" # bot:digest
        replicaCount: 1
        worker:
          enabled: false
        migrate:
          enabled: true                       # PreSync Job: cmd/migrate up
        # переменные приложения читаются с префиксом ORIGINATION_ (kit/conf): ORIGINATION_<СЕКЦИЯ>_<ПОЛЕ>
        env:
          ORIGINATION_LOG_LEVEL: debug
          ORIGINATION_NATS_URL: nats://nats.broker.svc.cluster.local:4222
          # JWT: провайдера (identity) в кластере пока нет, значения-заглушки
          ORIGINATION_JWT_JWKS_URL: http://identity.dev.svc.cluster.local/.well-known/jwks.json
          ORIGINATION_JWT_ISSUER: http://identity.dev.arba.kz
          ORIGINATION_JWT_AUDIENCE: arba
          # зависимости origination (секция upstream в kit/conf): адреса сервисов внутри кластера
          ORIGINATION_UPSTREAM_SCORING_URL: http://scoring.dev.svc.cluster.local:8080
          ORIGINATION_UPSTREAM_PRICING_URL: http://pricing.dev.svc.cluster.local:8080
          ORIGINATION_UPSTREAM_SERVICING_URL: http://servicing.dev.svc.cluster.local:8080
          # OAuth client_credentials: пока identity-заглушка, поэтому адрес токена условный; client_secret — из Vault
          ORIGINATION_UPSTREAM_TOKEN_URL: http://identity.dev.svc.cluster.local/oauth/token
          ORIGINATION_UPSTREAM_CLIENT_ID: origination
        secretEnv:
          - { name: ORIGINATION_DATABASE_DSN, secret: origination-db, key: dsn }
          - { name: ORIGINATION_UPSTREAM_CLIENT_SECRET, secret: origination-upstream, key: client_secret }
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

# Движок origination (arba/engines/origination) в окружении dev.
# Строки с маркером "bot:" обновляет CI сервиса (scripts/bump.sh), остальное правят люди.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-origination
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  source:
    repoURL: http://gitlab.arba.kz/arba/engines/origination.git
    targetRevision: 2a0d6879ddae95fb9d5c5be95e31aa4c672ecfc3 # bot:revision
    path: .helm
    helm:
      releaseName: origination
      valuesObject:
        global:
          env: dev
          tier: engine
        image:
          repository: registry.arba.kz/arba/engines/origination
          tag: "v0.1.0" # bot:tag
          digest: "sha256:88ad3787d1153f958f2d89e1ef46836c76e2bcd90598b394b003ed2826ae03ba" # bot:digest
        replicaCount: 1
        worker:
          enabled: false
        migrate:
          enabled: false
        env:
          LOG_LEVEL: debug
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

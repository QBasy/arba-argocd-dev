# Application сервиса servicing в dev. Создан автоматически (scripts/new-service.sh); строки с "bot:" обновляет CI.
# Настройки сервиса под окружение dev лежат В РЕПОЗИТОРИИ СЕРВИСА: .helm/values-dev.yaml (необязательный файл).
# Общие значения окружения (NATS, JWT, ...): values/dev-common.yaml в этом репозитории.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-servicing
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "5" }
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  sources:
    - repoURL: http://gitlab.arba.kz/arba/engines/servicing.git
      targetRevision: de1c368393702c880e7bf976b707cc019589ba26 # bot:revision
      path: .helm
      helm:
        releaseName: servicing
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/values/dev-common.yaml
          - values-dev.yaml
        valuesObject:
          global:
            env: dev
            tier: engine
          image:
            repository: registry.arba.kz/arba/engines/servicing
            tag: "v0.3.1" # bot:tag
            digest: "sha256:f00ba9c58aecdd283cfab9b7a6703325db115ac41b89bece3302a33f7a672a81" # bot:digest
          replicaCount: 1
          migrate:
            enabled: true                       # PreSync Job: cmd/migrate up
          env:
            SERVICING_LOG_LEVEL: debug
            SERVICING_NATS_URL: nats://nats.broker.svc.cluster.local:4222
            SERVICING_JWT_JWKS_URL: http://identity.dev.svc.cluster.local/.well-known/jwks.json
            SERVICING_JWT_ISSUER: http://identity.dev.arba.kz
            SERVICING_JWT_AUDIENCE: arba
          secretEnv:
            - { name: SERVICING_DATABASE_DSN, secret: servicing-db, key: dsn }
    - repoURL: http://gitlab.arba.kz/argocd/argocd-dev.git
      targetRevision: main
      ref: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

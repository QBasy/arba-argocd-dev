# Application сервиса pricing в dev. Создан автоматически (scripts/new-service.sh); строки с "bot:" обновляет CI.
# Настройки сервиса под окружение dev лежат В РЕПОЗИТОРИИ СЕРВИСА: .helm/values-dev.yaml (необязательный файл).
# Общие значения окружения (NATS, JWT, ...): values/dev-common.yaml в этом репозитории.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-pricing
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "5" }
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arba
  sources:
    - repoURL: http://gitlab.arba.kz/arba/engines/pricing.git
      targetRevision: 435dcb45056e6b23da4a04a7ffd3b77e6f0d92fd # bot:revision
      path: .helm
      helm:
        releaseName: pricing
        ignoreMissingValueFiles: true
        valueFiles:
          - $platform/values/dev-common.yaml
          - values-dev.yaml
        valuesObject:
          global:
            env: dev
            tier: engine
          image:
            repository: registry.arba.kz/arba/engines/pricing
            tag: "v0.3.1" # bot:tag
            digest: "sha256:b062a637bc261e63ec0f9687946846789d85050b00db47b30c8896f9680563da" # bot:digest
          replicaCount: 1
          migrate:
            enabled: true
          env:
            PRICING_LOG_LEVEL: debug
            PRICING_NATS_URL: nats://nats.broker.svc.cluster.local:4222
            PRICING_JWT_JWKS_URL: http://identity.dev.svc.cluster.local/.well-known/jwks.json
            PRICING_JWT_ISSUER: http://identity.dev.arba.kz
            PRICING_JWT_AUDIENCE: arba
          secretEnv:
            - { name: PRICING_DATABASE_DSN, secret: pricing-db, key: dsn }
    - repoURL: http://gitlab.arba.kz/argocd/argocd-dev.git
      targetRevision: main
      ref: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

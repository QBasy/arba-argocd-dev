# ClusterSecretStore (Vault) и ExternalSecret'ы сервисов. Нужны инициализированный Vault и записи в kv/dev/*.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  project: platform
  source:
    repoURL: http://gitlab.arba.kz/argocd/argocd-dev.git
    targetRevision: main
    path: manifests/secrets
  destination: { server: https://kubernetes.default.svc, namespace: dev }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [SkipDryRunOnMissingResource=true]

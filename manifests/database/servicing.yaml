# База servicing в общем кластере platform-db (владелец — одноимённая роль).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: servicing
  namespace: database
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  name: servicing
  owner: servicing
  cluster: { name: platform-db }

# Пароль БД origination хранится в Vault: kv/dev/origination-db {username, password}.
# 1) учётка для CloudNativePG (namespace database)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origination-db-credentials
  namespace: database
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: origination-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" }   # CNPG подхватывает смену пароля роли
  data:
    - { secretKey: username, remoteRef: { key: dev/origination-db, property: username } }
    - { secretKey: password, remoteRef: { key: dev/origination-db, property: password } }
---
# 2) DSN для приложения (namespace dev), ключ dsn -> ORIGINATION_DATABASE_DSN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origination-db
  namespace: dev
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: origination-db
    template:
      data:
        dsn: "postgres://{{ .username }}:{{ .password }}@platform-db-rw.database.svc.cluster.local:5432/origination?sslmode=require"
  data:
    - { secretKey: username, remoteRef: { key: dev/origination-db, property: username } }
    - { secretKey: password, remoteRef: { key: dev/origination-db, property: password } }

# client_secret для OAuth client_credentials (origination -> identity). Хранится в Vault: kv/dev/origination-upstream {client_secret}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origination-upstream
  namespace: dev
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: origination-upstream }
  data:
    - { secretKey: client_secret, remoteRef: { key: dev/origination-upstream, property: client_secret } }

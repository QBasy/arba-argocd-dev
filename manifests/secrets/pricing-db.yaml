# Пароль БД pricing хранится в Vault: kv/dev/pricing-db {username, password}.
# 1) пароль роли для CloudNativePG (namespace database)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricing-db-credentials
  namespace: database
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: pricing-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" }
  data:
    - { secretKey: username, remoteRef: { key: dev/pricing-db, property: username } }
    - { secretKey: password, remoteRef: { key: dev/pricing-db, property: password } }
---
# 2) DSN для приложения (namespace dev), ключ dsn -> <ИМЯ>_DATABASE_DSN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pricing-db
  namespace: dev
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: pricing-db
    template:
      data:
        dsn: "postgres://{{ .username }}:{{ .password }}@platform-db-rw.database.svc.cluster.local:5432/pricing?sslmode=require"
  data:
    - { secretKey: username, remoteRef: { key: dev/pricing-db, property: username } }
    - { secretKey: password, remoteRef: { key: dev/pricing-db, property: password } }
